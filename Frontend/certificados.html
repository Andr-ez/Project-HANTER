<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Certificados</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <h1>Certificados</h1>
  </header>
  <!-- Barra de navegación -->
  <nav>
    <a href="index.html">Inicio</a>
    <a href="perfil.html">Mi Perfil</a>
    <a href="certificados.html">Certificados</a>
    <a href="capacitaciones.html">Capacitaciones</a>
  </nav>

  <main>
    <h1>Gestión de Certificados</h1>

    <section class="tabla-certificados-container">
      <h2>📜 Lista de Certificados</h2>
    <table class="tabla-certificados">
      <thead>
        <tr>
          <th>ID Certificado</th>
          <th>Fecha de Emisión</th>
          <th>Tipo</th>
          <th>Observaciones</th>
          <th>ID Empleado</th>
          <th>ID Usuario</th>
        </tr>
      </thead>
      <tbody id="tabla-certificados"></tbody>
    </table>
    </section>
  </main>

  <script>
    // Espera a que cargue la página
    document.addEventListener("DOMContentLoaded", () => {
      const tbody = document.getElementById("tabla-certificados");

      fetch("http://localhost:8080/api/certificados")
        .then(response => response.json())
        .then(data => {
          tbody.innerHTML = ""; // Limpia cualquier fila previa
          data.forEach(certificado => {
            const fila = document.createElement("tr");
            fila.innerHTML = `
              <td>${certificado.id_certificado}</td>
              <td>${certificado.fecha_emision}</td>
              <td>${certificado.tipo_certificado}</td>
              <td>${certificado.observaciones}</td>
              <td>${certificado.id_empleado}</td>
              <td>${certificado.id_usuario}</td>
            `;
            tbody.appendChild(fila);
          });
        })
        .catch(error => console.error("Error al cargar los certificados:", error));
    });
  </script>
</body>
</html>
